name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: stable
        check-latest: true

    - name: Vet
      run: go vet ./...

    - name: Test
      run: go test ./...

    - name: Vulnerability check
      run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

    - name: Build
      run: make build
